name: Deploy CYBERTRMX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cybertrmx-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout production
        uses: actions/checkout@v4
        with:
          ref: main
          path: source-main

      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          path: source-staging

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/staging
          cp -a source-main/public/. site/
          cp -a source-staging/public/. site/staging/

          # Keep the staging worker in its own cache namespace so it cannot
          # delete or replace production cache entries.
          sed -i "s/const CACHE = 'cybertrmx-/const CACHE = 'cybertrmx-staging-/" site/staging/sw.js
          sed -i "s/const CACHE_NAMESPACE = 'cybertrmx-v'/const CACHE_NAMESPACE = 'cybertrmx-staging-v'/" site/staging/sw.js

          cat > site/staging/build.json <<'JSON'
          {
            "environment": "staging",
            "version": "5.3.0-r4",
            "terminal_parser": "native-r3-hook",
            "persistent_queue": true
          }
          JSON

          touch site/.nojekyll

      - name: Verify deployable production source
        shell: bash
        run: |
          set -euo pipefail
          test -f site/index.html
          test -f site/build.json
          test -f site/cloud-bootstrap.js
          test -f site/r3-terminal-bridge.js
          test -f site/jobs-r3.js
          grep -q '"version": "5.3.1"' site/build.json
          grep -q '"source_parser_guard": true' site/build.json
          grep -q "const V='5.3.1'" site/cloud-bootstrap.js
          grep -q 'installNativeQueueParser' site/cloud-bootstrap.js
          grep -q 'enableQueueForLoad' site/cloud-bootstrap.js
          grep -q "const V='5.3.1'" site/motion.js
          grep -q 'cybertrmx-v49' site/sw.js
          grep -q 'CURRENT BUILD / 5.3.1 / CACHE 49' site/patch-page.js
          node --check site/cloud-bootstrap.js
          node --check site/r3-terminal-bridge.js
          node --check site/jobs-r3.js
          node --check site/motion.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
