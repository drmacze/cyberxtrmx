name: Deploy CYBERTRMX to GitHub Pages

on:
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout guarded source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)

      - name: Run Production Guard contracts
        run: npm test

  ui-smoke:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser smoke tests
        run: npm run test:ui

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-smoke-${{ github.ref_name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: [guard, ui-smoke]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          ref: staging
          path: source-staging

      - name: Build production and staging site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/staging
          cp -a source-main/public/. site/
          cp -a source-staging/public/. site/staging/
          python - <<'PY'
          from pathlib import Path
          import json
          import os

          version = json.loads(Path('source-staging/package.json').read_text(encoding='utf-8'))['version']
          index = Path('site/staging/index.html')
          html = index.read_text(encoding='utf-8')
          if 'name="robots"' not in html:
              html = html.replace('<meta charset="utf-8">', '<meta charset="utf-8">\n<meta name="robots" content="noindex,nofollow">', 1)
          if 'name="cybertrmx-build"' not in html:
              html = html.replace('</head>', f'<meta name="cybertrmx-build" content="{version}">\n</head>', 1)
          marker = f'<script src="./staging-marker.js?v={version}"></script>'
          if 'staging-marker.js' not in html:
              html = html.replace('</body>', f'{marker}\n</body>')
          index.write_text(html, encoding='utf-8')

          sw = Path('site/staging/sw.js')
          source = sw.read_text(encoding='utf-8')
          source = source.replace("const CACHE = 'cybertrmx-", "const CACHE = 'cybertrmx-staging-")
          source = source.replace("const CACHE_NAMESPACE = 'cybertrmx-v'", "const CACHE_NAMESPACE = 'cybertrmx-staging-v'")
          sw.write_text(source, encoding='utf-8')

          build = {
              'environment': 'staging',
              'version': version,
              'source_ref': 'staging',
              'workflow_sha': os.environ.get('GITHUB_SHA', '')
          }
          Path('site/staging/build.json').write_text(json.dumps(build, separators=(',', ':')), encoding='utf-8')
          PY
          touch site/.nojekyll

      - name: Verify staged artifact identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./source-staging/package.json').version")"
          grep -q "name=\"cybertrmx-build\" content=\"${version}\"" site/staging/index.html
          grep -q "STAGING / ${version}" site/staging/staging-marker.js
          if [ "$version" = "5.3.0-r3" ]; then
            grep -q "jobs-r3.js" site/staging/cloud-bootstrap.js
            grep -q "security-r3.js" site/staging/cloud-bootstrap.js
            grep -q "cybertrmx-staging-v45-r3" site/staging/sw.js
            grep -q "jobs-r3.js" site/staging/sw.js
          fi
          node -e "const b=require('./site/staging/build.json'); if(b.environment!=='staging'||b.version!==process.argv[1]) process.exit(1)" "$version"
          echo "Verified staging artifact ${version}."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
