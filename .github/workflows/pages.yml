name: Deploy CYBERTRMX to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cybertrmx-pages-main
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout production
        uses: actions/checkout@v6
        with:
          ref: main
          path: source-main

      - name: Checkout staging candidate
        uses: actions/checkout@v6
        with:
          ref: staging
          path: source-staging

      - name: Build production and staging site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/staging
          cp -a source-main/public/. site/
          cp -a source-staging/public/. site/staging/

          python - <<'PY'
          from pathlib import Path
          import json
          import os

          version = json.loads(Path('source-staging/package.json').read_text(encoding='utf-8'))['version']
          index = Path('site/staging/index.html')
          html = index.read_text(encoding='utf-8')

          if 'name="robots"' not in html:
              html = html.replace(
                  '<meta charset="utf-8">',
                  '<meta charset="utf-8">\n<meta name="robots" content="noindex,nofollow">',
                  1,
              )
          if 'name="cybertrmx-build"' not in html:
              html = html.replace(
                  '</head>',
                  f'<meta name="cybertrmx-build" content="{version}">\n</head>',
                  1,
              )

          native_queue = version.startswith('5.3.0-r')
          if native_queue:
              early = (
                  f'<script id="cybertrmx-backend-config" data-ready="1" src="./backend-config.js?v={version}"></script>\n'
                  f'<script id="cybertrmx-jobs-r3" data-ready="1" src="./jobs-r3.js?v={version}"></script>\n'
                  f'<script id="cybertrmx-r3-terminal-bridge" src="./r3-terminal-bridge.js?v={version}"></script>\n'
              )
              needle = '<script src="./app.js" defer></script>'
              if 'r3-terminal-bridge.js' not in html:
                  if needle not in html:
                      raise SystemExit('Unable to locate app.js in staging index.')
                  html = html.replace(needle, early + needle, 1)

              app = Path('site/staging/app.js')
              app_source = app.read_text(encoding='utf-8')
              parser_needle = "if(!cmd)return;line(`root@trmx:"
              parser_hook = (
                  "if(!cmd)return;"
                  "if((cmd==='job'||cmd==='lookup')&&window.CYBERTRMX_R3_TERMINAL_BRIDGE?.execute){"
                  "await window.CYBERTRMX_R3_TERMINAL_BRIDGE.execute(raw);return}"
                  "line(`root@trmx:"
              )
              if 'CYBERTRMX_R3_TERMINAL_BRIDGE?.execute' not in app_source:
                  if parser_needle not in app_source:
                      raise SystemExit('Unable to locate the native terminal parser hook point.')
                  app_source = app_source.replace(parser_needle, parser_hook, 1)
                  app.write_text(app_source, encoding='utf-8')

          marker = f'<script src="./staging-marker.js?v={version}"></script>'
          if 'staging-marker.js' not in html:
              html = html.replace('</body>', f'{marker}\n</body>')
          index.write_text(html, encoding='utf-8')

          sw = Path('site/staging/sw.js')
          sw_source = sw.read_text(encoding='utf-8')
          sw_source = sw_source.replace("const CACHE = 'cybertrmx-", "const CACHE = 'cybertrmx-staging-")
          sw_source = sw_source.replace("const CACHE_NAMESPACE = 'cybertrmx-v'", "const CACHE_NAMESPACE = 'cybertrmx-staging-v'")
          sw.write_text(sw_source, encoding='utf-8')

          Path('site/staging/build.json').write_text(
              json.dumps({
                  'environment': 'staging',
                  'version': version,
                  'source_ref': 'staging',
                  'workflow_sha': os.environ.get('GITHUB_SHA', ''),
                  'terminal_parser': 'native-r3-hook' if native_queue else 'legacy',
              }, separators=(',', ':')),
              encoding='utf-8',
          )
          PY

          touch site/.nojekyll

      - name: Verify staging artifact identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./source-staging/package.json').version")"
          grep -q "name=\"cybertrmx-build\" content=\"${version}\"" site/staging/index.html
          grep -q "STAGING / ${version}" site/staging/staging-marker.js
          if [[ "$version" == 5.3.0-r* ]]; then
            grep -q "cybertrmx-staging-v" site/staging/sw.js
            grep -q "r3-terminal-bridge.js" site/staging/index.html
            grep -q "CYBERTRMX_R3_TERMINAL_BRIDGE?.execute" site/staging/app.js
            grep -q '"terminal_parser":"native-r3-hook"' site/staging/build.json
          fi
          if [ "$version" = "5.3.0-r4" ]; then
            grep -q "cybertrmx-staging-v47-r4" site/staging/sw.js
          fi
          echo "Verified deployable staging artifact ${version}."

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
