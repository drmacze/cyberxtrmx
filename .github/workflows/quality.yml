name: Verify CYBERTRMX

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)

      - name: Run source and contract tests
        run: npm test

      - name: Check required PWA assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          sw = Path('public/sw.js').read_text(encoding='utf-8')
          version = json.loads(Path('package.json').read_text(encoding='utf-8'))['version']
          assets = re.findall(r"'\./([^']+)'", sw)
          missing = [asset for asset in assets if asset and not (Path('public') / asset).exists()]
          if missing:
              raise SystemExit('Missing cached assets: ' + ', '.join(missing))
          required = {
              'security-utils.js', 'security-v52.js', 'security-v52.css',
              'command-hints-v52.js', 'tracker-engine.js', 'tracker-engine.css',
              'recovery-527.js', 'guard-v528.js', 'guard-v528.css', 'recover.html'
          }
          if version == '5.3.0-r2':
              required.update({'jobs-r2.js', 'jobs-r2.css'})
          absent = sorted(required.difference(assets))
          if absent:
              raise SystemExit('Required guarded assets are not cached: ' + ', '.join(absent))
          expected_cache = 'cybertrmx-v43-r2' if version == '5.3.0-r2' else 'cybertrmx-v42'
          if expected_cache not in sw:
              raise SystemExit(f'The active PWA cache is not {expected_cache}.')
          if "CACHE_NAMESPACE = 'cybertrmx-v'" not in sw:
              raise SystemExit('Production cache namespace is not isolated.')
          print(f'Validated {len(assets)} cached assets for {version}.')
          PY

      - name: Check active recovery and staging queue paths
        shell: bash
        run: |
          set -euo pipefail
          grep -q "guard-v528.js" public/cloud-bootstrap.js
          grep -q "recovery-527" public/motion.js
          grep -q "lastRequestId" public/recovery-527.js
          grep -q "dashboardLocations" public/recovery-527.js
          grep -q "CLEAN RELOAD" public/guard-v528.js
          if grep -qE "transport-v523|patch-click-v525|jobs-v53" public/cloud-bootstrap.js; then
            echo 'Withdrawn loader is still active in connected bootstrap.'
            exit 1
          fi
          if [ "$(node -p "require('./package.json').version")" = "5.3.0-r2" ]; then
            grep -q "jobs-r2.js" public/cloud-bootstrap.js
            grep -q "jobsFunction: 'cybertrmx-jobs'" public/backend-config.js
            grep -q "Failure of this panel never changes the Operations runtime status" public/jobs-r2.js
            if grep -qE "window\.fetch\s*=|supabase\.createClient\s*=|functions\.invoke\s*=" public/jobs-r2.js; then
              echo 'Staging jobs replaces a protected global transport.'
              exit 1
            fi
          fi
          echo 'Guarded recovery and staging queue paths passed.'

      - name: Check security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "x-device-id" public/security-v52.js
          grep -q "x-idempotency-key" public/security-v52.js
          grep -q "x-submission-key" public/checkin.js
          grep -q "Credentials are only accepted in the protected account form" public/security-v52.js
          if grep -q "auth create <email> <password>" public/command-hints-v52.js; then
            echo 'Credential-bearing terminal clue found.'
            exit 1
          fi
          echo 'Security contract check passed.'

      - name: Check product copy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.html' --include='*.js' --include='*.md' '\b(simulator|simulation|simulasi)\b' public README.md; then
            echo 'Blocked product wording found.'
            exit 1
          fi
          echo 'Product copy check passed.'

  ui-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop and iPhone smoke tests
        run: npm run test:ui

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-smoke-report-${{ github.ref_name }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
