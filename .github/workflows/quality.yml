name: Verify CYBERTRMX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)

      - name: Run source and contract tests
        run: npm test

      - name: Check required PWA assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sw = Path('public/sw.js').read_text(encoding='utf-8')
          assets = re.findall(r"'\./([^']+)'", sw)
          missing = [asset for asset in assets if asset and not (Path('public') / asset).exists()]
          if missing:
              raise SystemExit('Missing cached assets: ' + ', '.join(missing))
          required = {'security-utils.js', 'security-v52.js', 'security-v52.css', 'command-hints-v52.js'}
          absent = sorted(required.difference(assets))
          if absent:
              raise SystemExit('5.2 security assets are not cached: ' + ', '.join(absent))
          if 'cybertrmx-v35' not in sw:
              raise SystemExit('The active PWA cache is not the 5.2.2 cache.')
          print(f'Validated {len(assets)} cached assets.')
          PY

      - name: Check security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "x-device-id" public/security-v52.js
          grep -q "x-idempotency-key" public/security-v52.js
          grep -q "x-submission-key" public/checkin.js
          grep -q "Credentials are only accepted in the protected account form" public/security-v52.js
          if grep -q "auth create <email> <password>" public/command-hints-v52.js; then
            echo 'Credential-bearing terminal clue found.'
            exit 1
          fi
          echo 'Security contract check passed.'

      - name: Check product copy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.html' --include='*.js' --include='*.md' '\b(simulator|simulation|simulasi)\b' public README.md; then
            echo 'Blocked product wording found.'
            exit 1
          fi
          echo 'Product copy check passed.'

  ui-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop and iPhone smoke tests
        run: npm run test:ui

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
