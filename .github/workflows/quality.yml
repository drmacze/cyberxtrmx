name: Verify CYBERTRMX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find public -type f -name '*.js' -print0)

      - name: Run security and job tests
        run: npm test

      - name: Check compact PWA shell
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          sw = Path('public/sw.js').read_text(encoding='utf-8')
          shell_match = re.search(r'const SHELL = \[(.*?)\];', sw, re.S)
          if not shell_match:
              raise SystemExit('PWA shell list is missing.')
          assets = re.findall(r"'\./([^']+)'", shell_match.group(1))
          missing = [asset for asset in assets if asset and not (Path('public') / asset).exists()]
          if missing:
              raise SystemExit('Missing shell assets: ' + ', '.join(missing))
          if len(assets) > 12:
              raise SystemExit(f'Startup shell is too large: {len(assets)} assets')
          required = {'index.html','styles.css','mobile.css','landing.css','mobile-performance-v533.css','app.js','motion.js'}
          absent = sorted(required.difference(assets))
          if absent:
              raise SystemExit('Required startup assets are missing: ' + ', '.join(absent))
          if 'cybertrmx-v31' not in sw:
              raise SystemExit('The active PWA cache is not the 5.3.3 cache.')
          print(f'Validated compact shell with {len(assets)} assets.')
          PY

      - name: Check startup performance contract
        shell: bash
        run: |
          set -euo pipefail
          if grep -qE 'gsap\.min\.js|ScrollTrigger\.min\.js|lenis\.min\.js' public/index.html; then
            echo 'External motion libraries must not block index startup.'
            exit 1
          fi
          grep -q 'app.js?v=5.3.3' public/index.html
          grep -q 'motion.js?v=5.3.3' public/index.html
          grep -q 'touch-shell' public/motion.js
          grep -q 'scheduleFeatureModules' public/motion.js
          grep -q 'loadDesktopMotion' public/motion.js
          grep -q 'scrollRestoration' public/motion.js
          grep -q 'ignoreSearch: true' public/sw.js
          echo 'Startup performance contract passed.'

      - name: Check security contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "x-device-id" public/security-v52.js
          grep -q "x-idempotency-key" public/security-v52.js
          grep -q "x-device-id" public/device-v531.js
          grep -q "DEVICE_ID_REQUIRED" public/device-v531.js
          grep -q "device-v531.js" public/cloud-bootstrap.js
          grep -q "jobs-v53.js" public/cloud-bootstrap.js
          grep -q "x-submission-key" public/checkin.js
          grep -q "Credentials are only accepted in the protected account form" public/security-v52.js
          if grep -q "auth create <email> <password>" public/command-hints-v52.js; then
            echo 'Credential-bearing terminal clue found.'
            exit 1
          fi
          echo 'Security contract check passed.'

      - name: Check persistent job contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -qi "for update skip locked" supabase/migrations/20260804200000_cybertrmx_v53_real_job_engine.sql
          grep -q "lease_expires_at" supabase/migrations/20260804200000_cybertrmx_v53_real_job_engine.sql
          grep -q "dead_letter" supabase/migrations/20260804200000_cybertrmx_v53_real_job_engine.sql
          grep -q "cron.schedule" supabase/migrations/20260804200000_cybertrmx_v53_real_job_engine.sql
          grep -q "claim_next_job" supabase/functions/cybertrmx-worker/index.ts
          grep -q "heartbeat_job" supabase/functions/cybertrmx-worker/index.ts
          grep -q "cancel_job" supabase/functions/cybertrmx-jobs/index.ts
          grep -q "retry_job" supabase/functions/cybertrmx-jobs/index.ts
          echo 'Persistent job contract check passed.'

      - name: Check product copy
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE --include='*.html' --include='*.js' --include='*.md' '\b(simulator|simulation|simulasi)\b' public README.md; then
            echo 'Blocked product wording found.'
            exit 1
          fi
          echo 'Product copy check passed.'
