<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>CYBERTRMX Recovery</title>
<style>
html,body{margin:0;min-height:100%;background:#08090b;color:#eef0f2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{display:grid;place-items:center;padding:24px}.card{width:min(460px,100%);padding:28px;border:1px solid #252a31;border-radius:20px;background:#0d1014}.dot{display:inline-block;width:8px;height:8px;margin-right:9px;border-radius:50%;background:#e64862}.card small{color:#7b848e;letter-spacing:.12em}.card h1{font-family:system-ui,-apple-system,sans-serif;font-size:30px;letter-spacing:-.04em}.card p{color:#9ba3ad;line-height:1.65}.bar{height:4px;margin-top:22px;background:#1b2026;overflow:hidden}.bar i{display:block;height:100%;width:15%;background:#e64862;animation:move 1.1s infinite ease-in-out}@keyframes move{50%{width:82%}100%{width:100%}}</style>
</head>
<body><main class="card"><small><span class="dot"></span>CYBERTRMX / CLEAN RECOVERY</small><h1>Replacing application caches</h1><p id="status">Removing old service workers and cached interface modules. Account sessions and workspace data are not deleted.</p><div class="bar"><i></i></div></main>
<script>
(async()=>{
  const status=document.querySelector('#status');
  try{
    if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.filter(key=>key.startsWith('cybertrmx-')).map(key=>caches.delete(key)))}
    status.textContent='Cache replaced. Opening CYBERTRMX 5.2.8 from the network.';
  }catch(error){status.textContent='Opening the guarded build.'}
  setTimeout(()=>location.replace(`./?v=5.2.8&clean=${Date.now()}`),700);
})();
</script></body></html>
